# cliff.toml
# git-cliff 配置：从 Conventional Commits 生成分类 changelog

[changelog]
header = ""
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true

commit_parsers = [
  # 破坏性变更置顶（放在最前面）
  { message = "^feat.*!:", group = "<!-- 0 -->⚠ Breaking Changes" },
  { message = "^fix.*!:",  group = "<!-- 0 -->⚠ Breaking Changes" },
  { body = ".*BREAKING[ -]CHANGE.*", group = "<!-- 0 -->⚠ Breaking Changes" },

  # 常规类型分组
  { message = "^feat",     group = "<!-- 1 -->Features" },
  { message = "^fix",      group = "<!-- 2 -->Bug Fixes" },
  { message = "^perf",     group = "<!-- 3 -->Performance" },
  { message = "^refactor", group = "<!-- 4 -->Refactoring" },
  { message = "^docs?",    group = "<!-- 5 -->Documentation" },
  { message = "^test",     group = "<!-- 6 -->Tests" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore\\(deps\\)",    group = "<!-- 7 -->Dependencies" },
  { message = "^chore",    group = "<!-- 8 -->Chores" },
  { message = "^ci",       group = "<!-- 9 -->CI" },
  { message = "^style",    group = "<!-- 10 -->Styling" },
  { message = "^build",    group = "<!-- 11 -->Build" },

  # 兜底：未匹配到的 conventional commit 归到 Other
  { message = ".*", group = "<!-- 12 -->Other", default_scope = "other" },
]

# 只保留 HEAD 可达的 commit（避免历史分支噪声）
filter_commits = false