[changelog]
header = ""
body = """
{% set authors = commits | map(attribute="author.name") | unique | sort %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | split(pat="-->") | last | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}：** {% endif %}{{ commit.message | upper_first }}{% if commit.breaking %} ⚠️{% endif %} — [`{{ commit.id | truncate(length=7, end="") }}`](https://github.com/{{ get_env(name="GITHUB_REPO") }}/commit/{{ commit.id }})
{% endfor %}
{% endfor %}
{% if authors | length > 0 %}
## 🙏 贡献者

感谢以下贡献者对本版本的贡献：

{% for author in authors %}
- {{ author }}
{% endfor %}
{% endif %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true

commit_parsers = [
  # 破坏性变更置顶
  { message = "^feat.*!:", group = "<!-- 00 -->⚠️ 破坏性变更" },
  { message = "^fix.*!:",  group = "<!-- 00 -->⚠️ 破坏性变更" },
  { body = ".*BREAKING[ -]CHANGE.*", group = "<!-- 00 -->⚠️ 破坏性变更" },

  { message = "^feat",     group = "<!-- 01 -->✨ 新功能" },
  { message = "^fix",      group = "<!-- 02 -->🐛 问题修复" },
  { message = "^perf",     group = "<!-- 03 -->⚡ 性能优化" },
  { message = "^refactor", group = "<!-- 04 -->♻️ 代码重构" },
  { message = "^docs?",    group = "<!-- 05 -->📝 文档" },
  { message = "^test",     group = "<!-- 06 -->✅ 测试" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore\\(deps\\)",    group = "<!-- 07 -->📦 依赖更新" },
  { message = "^chore",    group = "<!-- 08 -->🔧 杂项" },
  { message = "^ci",       group = "<!-- 09 -->👷 流水线" },
  { message = "^style",    group = "<!-- 10 -->💄 代码风格" },
  { message = "^build",    group = "<!-- 11 -->🏗️ 构建" },

  { message = ".*", group = "<!-- 12 -->📌 其他", default_scope = "other" },
]

filter_commits = false
