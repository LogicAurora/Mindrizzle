name: Deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只允许一次发布，避免并发推送互相覆盖 Pages 产物
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bunx vue-tsc --noEmit

      # Pages 部署在 /<仓库名>/ 子路径下，base 必须跟着变；Tauri 打包仍走默认的 /
      - name: Build
        run: bunx vite build --base=/${{ github.event.repository.name }}/

      # 项目产物没有下划线前缀文件，加 .nojekyll 防止 Jekyll 未来误吞静态资源
      - name: Disable Jekyll
        run: touch dist/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
