name: Updater channel mirror

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      # alpha/beta 的更新地址是固定 tag 的锚点 release，客户端只认 <channel>-channel/latest.json，
      # 靠发布事件把真实版本的清单镜像过去，避免每次发版都手动执行一段 gh 命令
      - name: Mirror latest.json to channel anchor
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta)\.[0-9]+$ ]]; then
            echo "非 alpha/beta 预发布（$TAG），跳过"
            exit 0
          fi

          CH="${BASH_REMATCH[1]}"
          CH_TAG="${CH}-channel"
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT

          gh release download "$TAG" --repo "$REPO" --pattern latest.json --dir "$WORK" --clobber
          gh release view "$CH_TAG" --repo "$REPO" >/dev/null 2>&1 \
            || gh release create "$CH_TAG" --repo "$REPO" --title "Updater channel: $CH" \
                 --notes "固定通道锚点，请勿删除" --prerelease
          gh release upload "$CH_TAG" "$WORK/latest.json" --repo "$REPO" --clobber
          echo "已把 $TAG 的 latest.json 镜像到 $CH_TAG" >> "$GITHUB_STEP_SUMMARY"
