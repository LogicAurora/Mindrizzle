[package]
name = "Mindrizzle"
version = "0.1.0"
description = "Catch your mind drizzle."
authors = ["Ivan Hu233"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mindrizzle_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = { version = "2.10.1" }
tauri-plugin-opener = "2.7.2"
tauri-plugin-dialog = "2.8.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
platform-dirs = "0.3.0"
quick-xml = { version = "0.42.0", features = ["serialize", "encoding"] }
tokio = "1.54.1"
chrono = "0.4.45"
log = "0.4.34"
tar = "0.4.46"
flate2 = "1.1.10"
walkdir = "2.5.0"
anyhow = "1.0.104"
base64 = "0.23.1"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
url = "2.5.8"
wallpaper = "3.2.0"

